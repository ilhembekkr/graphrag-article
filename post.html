<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GraphRAG — LinkedIn poster</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f8fafc;
        --text: #0f172a;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --accent: #2563eb;
        --accent-color: #2563eb;
        --accent-light: #eff6ff;
        --success-color: #16a34a;
        --success-light: #dcfce7;
        --border: #e2e8f0;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      /* LinkedIn — 1080 x 1100 */
      .poster {
        width: 1080px;
        height: 1100px;
        background: var(--bg);
        position: relative;
        overflow: hidden;
        padding: 56px 70px 48px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 0;
        pointer-events: none;
      }
      .glow.a { width: 560px; height: 560px; background: #dbeafe; top: -200px; right: -180px; }
      .glow.b { width: 480px; height: 480px; background: #ede9fe; bottom: -180px; left: -160px; opacity: 0.7; }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .eyebrow {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 14px;
      }

      .title {
        font-size: 88px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.04em;
        color: var(--text);
        margin: 0 0 16px;
      }
      .title .accent {
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .dek {
        font-size: 22px;
        line-height: 1.4;
        color: var(--text-secondary);
        max-width: 880px;
        margin: 0 0 22px;
        font-weight: 400;
      }
      .dek strong { color: var(--text); font-weight: 600; }

      .pipeline-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 -10px;
      }
      .pipeline-viz {
        width: 100%;
        height: auto;
        display: block;
      }
      .pipeline-viz text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .pv-band-label { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; fill: var(--text-secondary); font-weight: 600; }
      .pv-band-meta { font-size: 13px; letter-spacing: 0.06em; fill: var(--text-muted); }
      .pv-stage-title { font-size: 16px; font-weight: 700; fill: var(--text-primary); }
      .pv-stage-cost { font-size: 13px; fill: var(--text-secondary); }
      .pv-num { font-size: 12px; font-weight: 700; fill: #fff; }
      .pv-artifact-title { font-size: 17px; font-weight: 700; fill: var(--text-primary); }
      .pv-artifact-sub { font-size: 13px; fill: var(--text-secondary); font-style: italic; }
      .pv-engine-title { font-size: 17px; font-weight: 700; fill: var(--text-primary); }
      .pv-engine-body { font-size: 14px; fill: var(--text-secondary); }
      .pv-engine-tag { font-size: 12.5px; fill: var(--text-muted); font-style: italic; }

      .author {
        display: flex;
        align-items: center;
        gap: 18px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
        margin-top: 18px;
      }
      .author img {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        object-fit: cover;
        object-position: top center;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
      .author-name {
        font-size: 23px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 3px;
      }
      .author-role {
        font-size: 16px;
        color: var(--text-secondary);
        line-height: 1.4;
      }

      .cta {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--text);
        color: white;
        font-size: 18px;
        font-weight: 600;
        padding: 16px 24px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .cta svg { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="glow a"></div>
      <div class="glow b"></div>

      <div class="content">
        <div class="eyebrow">Technical deep dive</div>

        <h1 class="title">
          Graph<span class="accent">RAG</span>
        </h1>

        <p class="dek">
          Six build-time stages produce the graph + summaries.<br/>
          <strong>Two runtime engines consume them.</strong>
        </p>

        <div class="pipeline-wrap">
          <svg class="pipeline-viz" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" aria-label="GraphRAG pipeline overview">
            <defs>
              <marker id="pv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
              </marker>
              <filter id="pv-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
              </filter>
            </defs>

            <text x="12" y="16" class="pv-band-label">§ Build time · indexing</text>
            <text x="1088" y="16" class="pv-band-meta" text-anchor="end">run once · expensive</text>

            <g filter="url(#pv-shadow)">
              <rect x="30" y="40" width="145" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
              <circle cx="46" cy="56" r="11" fill="#64748b"/>
              <text x="46" y="60" text-anchor="middle" class="pv-num">1</text>
              <text x="102" y="78" text-anchor="middle" class="pv-stage-title">Chunk</text>
              <text x="102" y="96" text-anchor="middle" class="pv-stage-cost">token splits</text>
            </g>
            <text x="102" y="132" text-anchor="middle" class="pv-stage-cost" style="fill: var(--text-muted);">CPU · 0%</text>

            <g filter="url(#pv-shadow)">
              <rect x="192" y="40" width="145" height="70" rx="10" fill="var(--accent-light)" stroke="var(--accent-color)" stroke-width="1.2"/>
              <circle cx="208" cy="56" r="11" fill="var(--accent-color)"/>
              <text x="208" y="60" text-anchor="middle" class="pv-num">2</text>
              <text x="264" y="78" text-anchor="middle" class="pv-stage-title">Extract</text>
              <text x="264" y="96" text-anchor="middle" class="pv-stage-cost">entities + rels</text>
            </g>
            <text x="264" y="132" text-anchor="middle" class="pv-stage-cost" style="fill: var(--accent-color); font-weight: 600;">LLM · ~75%</text>

            <g filter="url(#pv-shadow)">
              <rect x="354" y="40" width="145" height="70" rx="10" fill="var(--accent-light)" stroke="var(--accent-color)" stroke-width="1.2"/>
              <circle cx="370" cy="56" r="11" fill="var(--accent-color)"/>
              <text x="370" y="60" text-anchor="middle" class="pv-num">3</text>
              <text x="426" y="78" text-anchor="middle" class="pv-stage-title">Dedupe</text>
              <text x="426" y="96" text-anchor="middle" class="pv-stage-cost">merge descriptions</text>
            </g>
            <text x="426" y="132" text-anchor="middle" class="pv-stage-cost" style="fill: var(--accent-color); font-weight: 600;">LLM · ~10%</text>

            <g filter="url(#pv-shadow)">
              <rect x="516" y="40" width="145" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
              <circle cx="532" cy="56" r="11" fill="#64748b"/>
              <text x="532" y="60" text-anchor="middle" class="pv-num">4</text>
              <text x="588" y="78" text-anchor="middle" class="pv-stage-title">Detect</text>
              <text x="588" y="96" text-anchor="middle" class="pv-stage-cost">hierarchical clusters</text>
            </g>
            <text x="588" y="132" text-anchor="middle" class="pv-stage-cost" style="fill: var(--text-muted);">CPU · 0%</text>

            <g filter="url(#pv-shadow)">
              <rect x="678" y="40" width="145" height="70" rx="10" fill="var(--accent-light)" stroke="var(--accent-color)" stroke-width="1.2"/>
              <circle cx="694" cy="56" r="11" fill="var(--accent-color)"/>
              <text x="694" y="60" text-anchor="middle" class="pv-num">5</text>
              <text x="750" y="78" text-anchor="middle" class="pv-stage-title">Report</text>
              <text x="750" y="96" text-anchor="middle" class="pv-stage-cost">community summaries</text>
            </g>
            <text x="750" y="132" text-anchor="middle" class="pv-stage-cost" style="fill: var(--accent-color); font-weight: 600;">LLM · ~10%</text>

            <g filter="url(#pv-shadow)">
              <rect x="840" y="40" width="145" height="70" rx="10" fill="var(--success-light)" stroke="var(--success-color)" stroke-width="1.2"/>
              <circle cx="856" cy="56" r="11" fill="var(--success-color)"/>
              <text x="856" y="60" text-anchor="middle" class="pv-num">6</text>
              <text x="912" y="78" text-anchor="middle" class="pv-stage-title">Embed</text>
              <text x="912" y="96" text-anchor="middle" class="pv-stage-cost">vectors for search</text>
            </g>
            <text x="912" y="132" text-anchor="middle" class="pv-stage-cost" style="fill: var(--success-color); font-weight: 600;">Vec · ~5%</text>

            <line x1="175" y1="75" x2="190" y2="75" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>
            <line x1="337" y1="75" x2="352" y2="75" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>
            <line x1="499" y1="75" x2="514" y2="75" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>
            <line x1="661" y1="75" x2="676" y2="75" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>
            <line x1="823" y1="75" x2="838" y2="75" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>

            <line x1="550" y1="160" x2="550" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>

            <g filter="url(#pv-shadow)">
              <rect x="270" y="218" width="560" height="92" rx="12" fill="#fff" stroke="var(--accent-color)" stroke-width="1.5" stroke-dasharray="6 4"/>
              <text x="550" y="250" text-anchor="middle" class="pv-artifact-title">Knowledge graph &#43; community reports &#43; embeddings</text>
              <text x="550" y="274" text-anchor="middle" class="pv-artifact-sub">persisted to parquet / vector store · read at query time</text>
              <text x="550" y="296" text-anchor="middle" class="pv-stage-cost" style="fill: var(--text-muted);">entities · relationships · communities · reports · text-unit embeddings</text>
            </g>

            <line x1="550" y1="318" x2="550" y2="362" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>

            <text x="12" y="358" class="pv-band-label">§ Query time · two engines</text>
            <text x="1088" y="358" class="pv-band-meta" text-anchor="end">per query · cheap</text>

            <g filter="url(#pv-shadow)">
              <rect x="30" y="438" width="140" height="44" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
              <text x="100" y="465" text-anchor="middle" class="pv-stage-title">user query</text>
            </g>

            <path d="M 170 460 C 200 460, 200 415, 230 415" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>
            <path d="M 170 460 C 200 460, 200 505, 230 505" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pv-arrow)"/>

            <g filter="url(#pv-shadow)">
              <rect x="240" y="380" width="850" height="72" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
              <text x="260" y="408" class="pv-engine-title">Local · graph walk</text>
              <text x="260" y="430" class="pv-engine-body">seed entities (embed sim) → fan out to neighborhood → pack entities + rels + chunks + reports → LLM</text>
              <text x="260" y="446" class="pv-engine-tag">good for: specific facts · "what does module X depend on?"</text>
            </g>

            <g filter="url(#pv-shadow)">
              <rect x="240" y="468" width="850" height="72" rx="10" fill="var(--accent-light)" stroke="var(--accent-color)" stroke-width="1.5"/>
              <text x="260" y="496" class="pv-engine-title">Global · map-reduce</text>
              <text x="260" y="518" class="pv-engine-body">shuffle community reports → map: LLM extracts key points in parallel → reduce: LLM aggregates → answer</text>
              <text x="260" y="534" class="pv-engine-tag">good for: themes &amp; synthesis · "recurring risks across 200 reports?"</text>
            </g>
          </svg>
        </div>

        <div class="author">
          <img src="images/ilhem.png" alt="Ilhem Bekkar" />
          <div>
            <div class="author-name">Ilhem Bekkar</div>
            <div class="author-role">Agentic AI Engineer @ Omundu · Research Engineer @ LIRIS</div>
          </div>
          <div class="cta">
            Read the article
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
